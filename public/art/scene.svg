<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Original painted scene: a harbour street at golden hour with two track cars.
       Drawn from scratch for RUGRADAR; no photos or third-party artwork. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f5d7c"/>
      <stop offset="0.35" stop-color="#7a95a6"/>
      <stop offset="0.62" stop-color="#f2b46c"/>
      <stop offset="0.8" stop-color="#ffd58a"/>
      <stop offset="1" stop-color="#ffe7b0"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f9fae"/><stop offset="1" stop-color="#2d6476"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b79a7a"/><stop offset="0.5" stop-color="#7d6a5b"/><stop offset="1" stop-color="#4a4038"/>
    </linearGradient>
    <linearGradient id="leftWall" x1="0" x2="1">
      <stop offset="0" stop-color="#8a5a3c"/><stop offset="1" stop-color="#d9a46c"/>
    </linearGradient>
    <linearGradient id="rightWall" x1="1" x2="0">
      <stop offset="0" stop-color="#5a4a52"/><stop offset="1" stop-color="#b98a6a"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6a4d"/><stop offset="0.5" stop-color="#d42a22"/><stop offset="1" stop-color="#7a1210"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0a0"/><stop offset="0.45" stop-color="#f5c21b"/><stop offset="1" stop-color="#9a6a08"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d8"/><stop offset="0.4" stop-color="#ffd27a" stop-opacity=".8"/><stop offset="1" stop-color="#ffb35a" stop-opacity="0"/>
    </radialGradient>

    <!-- oil paint: wobble every edge, then add raised brush texture lit from the top left -->
    <filter id="paint" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.03" numOctaves="3" seed="7" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="26" xChannelSelector="R" yChannelSelector="G" result="wobbly"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.09 0.025" numOctaves="2" seed="3" result="strokes"/>
      <feDisplacementMap in="wobbly" in2="strokes" scale="14" xChannelSelector="R" yChannelSelector="B" result="brushed"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.11" numOctaves="4" seed="11" result="bump"/>
      <feDiffuseLighting in="bump" surfaceScale="1.8" lighting-color="#fff2dc" result="light">
        <feDistantLight azimuth="225" elevation="52"/>
      </feDiffuseLighting>
      <feComposite in="brushed" in2="light" operator="arithmetic" k1="1.15" k2="0" k3="0" k4="0" result="lit"/>
      <feComponentTransfer in="lit"><feFuncR type="gamma" exponent="0.9"/><feFuncG type="gamma" exponent="0.92"/><feFuncB type="gamma" exponent="1"/></feComponentTransfer>
    </filter>
  </defs>

  <g filter="url(#paint)">
    <!-- sky and sun -->
    <rect x="-120" y="-120" width="2160" height="1320" fill="#4a4038"/>
    <rect x="-120" y="-120" width="2160" height="700" fill="url(#sky)"/>
    <circle cx="1040" cy="430" r="260" fill="url(#sun)"/>
    <g opacity=".85">
      <ellipse cx="420" cy="170" rx="330" ry="48" fill="#f3c9a0"/>
      <ellipse cx="560" cy="210" rx="240" ry="30" fill="#e79a7a"/>
      <ellipse cx="1360" cy="120" rx="380" ry="56" fill="#f6d0a8"/>
      <ellipse cx="1240" cy="170" rx="260" ry="34" fill="#e8a07f"/>
      <ellipse cx="900" cy="300" rx="300" ry="26" fill="#ffd9a0"/>
      <ellipse cx="1600" cy="300" rx="220" ry="22" fill="#f0b68a"/>
    </g>

    <!-- sea glimpse and far hills -->
    <path d="M640 470 Q800 430 960 452 Q1120 430 1300 468 L1300 520 L640 520 Z" fill="#8c7b8c" opacity=".7"/>
    <rect x="600" y="486" width="740" height="60" fill="url(#sea)"/>
    <g stroke="#ffe3a0" stroke-width="5" stroke-linecap="round" opacity=".9">
      <path d="M940 500 L1000 500 M900 514 L980 514 M1010 512 L1090 512 M960 528 L1060 528 M1080 524 L1130 524"/>
    </g>

    <!-- road -->
    <path d="M-160 1200 L880 520 L1060 520 L2080 1200 Z" fill="url(#road)"/>
    <g stroke="#ffd690" stroke-linecap="round" opacity=".55">
      <path d="M960 540 L940 640 M965 690 L935 820 M970 880 L930 1080" stroke-width="10"/>
      <path d="M760 760 L700 830 M1180 760 L1260 860 M600 960 L520 1060 M1340 950 L1440 1070" stroke-width="7"/>
    </g>
    <!-- pavement edges -->
    <path d="M-40 1080 L880 520 L840 520 L-40 960 Z" fill="#c9a27a"/>
    <path d="M1960 1080 L1060 520 L1110 520 L1960 940 Z" fill="#a58a74"/>

    <!-- left buildings -->
    <path d="M-120 170 L0 180 L620 300 L620 520 L860 530 L0 980 L-120 1100 Z" fill="url(#leftWall)"/>
    <path d="M620 300 L760 340 L760 520 L620 520 Z" fill="#e6b47c"/>
    <g fill="#5a3826">
      <path d="M60 250 L180 270 L180 340 L60 330 Z"/><path d="M240 290 L340 305 L340 360 L240 352 Z"/><path d="M400 320 L480 332 L480 375 L400 370 Z"/>
      <path d="M60 400 L180 405 L180 560 L60 580 Z"/><path d="M240 410 L340 412 L340 530 L240 545 Z"/><path d="M400 415 L480 416 L480 510 L400 520 Z"/>
      <path d="M520 420 L580 420 L580 495 L520 500 Z"/>
    </g>
    <g fill="#ffcf7a" opacity=".85">
      <path d="M70 262 L170 280 L170 320 L70 312 Z"/><path d="M250 420 L330 422 L330 470 L250 476 Z"/>
    </g>
    <g stroke="#3a2618" stroke-width="6"><path d="M40 370 L200 374 M220 376 L360 380 M380 382 L500 386"/></g>

    <!-- right buildings -->
    <path d="M2040 170 L1920 180 L1300 300 L1300 520 L1080 530 L1920 960 L2040 1100 Z" fill="url(#rightWall)"/>
    <path d="M1300 300 L1180 340 L1180 520 L1300 520 Z" fill="#d0a07a"/>
    <g fill="#33262e">
      <path d="M1840 250 L1720 270 L1720 340 L1840 330 Z"/><path d="M1660 290 L1560 305 L1560 360 L1660 352 Z"/>
      <path d="M1840 400 L1720 405 L1720 560 L1840 580 Z"/><path d="M1660 410 L1560 412 L1560 530 L1660 545 Z"/>
    </g>
    <g fill="#ffc46a" opacity=".9"><path d="M1830 262 L1730 280 L1730 320 L1830 312 Z"/><path d="M1650 420 L1570 422 L1570 470 L1650 478 Z"/></g>
    <!-- trees and lamp post -->
    <g fill="#3f5a3a"><ellipse cx="1300" cy="430" rx="90" ry="70"/><ellipse cx="1230" cy="470" rx="60" ry="50" fill="#56704a"/><ellipse cx="660" cy="440" rx="70" ry="60"/></g>
    <g stroke="#1e1a1a" stroke-width="12"><path d="M1560 1040 L1560 560"/></g>
    <circle cx="1560" cy="548" r="22" fill="#ffe0a0"/>
    <!-- railing and flowers bottom right -->
    <g stroke="#2a2222" stroke-width="5"><path d="M1440 760 L1920 980"/>
      <path d="M1480 778 L1480 830 M1530 800 L1530 856 M1580 822 L1580 880 M1630 846 L1630 906 M1680 868 L1680 930 M1730 892 L1730 956 M1780 914 L1780 980 M1830 938 L1830 1004"/></g>
    <g>
      <ellipse cx="1760" cy="1030" rx="200" ry="70" fill="#4d6a3c"/>
      <g fill="#e2456a"><circle cx="1650" cy="1000" r="18"/><circle cx="1700" cy="1020" r="20"/><circle cx="1760" cy="990" r="16"/><circle cx="1820" cy="1015" r="22"/><circle cx="1880" cy="995" r="18"/><circle cx="1720" cy="1060" r="20"/></g>
      <g fill="#ff9ab0"><circle cx="1680" cy="995" r="9"/><circle cx="1790" cy="1005" r="10"/><circle cx="1860" cy="1040" r="9"/></g>
    </g>

    <!-- distant traffic and people -->
    <g><rect x="930" y="560" width="46" height="22" rx="6" fill="#2e3c4a"/><rect x="1000" y="575" width="54" height="26" rx="7" fill="#d8d2c6"/><rect x="880" y="590" width="58" height="28" rx="8" fill="#5a7ca0"/></g>
    <g fill="#2a2020"><rect x="760" y="600" width="10" height="34"/><rect x="790" y="606" width="9" height="30"/><rect x="1160" y="610" width="10" height="34"/></g>

    <!-- red track car, rear three-quarter, mid street -->
    <g transform="translate(1010 640)">
      <ellipse cx="190" cy="190" rx="230" ry="26" fill="#1a1210" opacity=".55"/>
      <path d="M10 150 Q8 100 40 80 L110 40 Q190 10 270 40 L340 80 Q376 100 372 150 L366 182 L16 182 Z" fill="url(#red)"/>
      <path d="M100 52 Q190 18 280 52 L250 80 Q190 64 130 80 Z" fill="#1d1a22"/>
      <path d="M0 70 L380 70 L376 84 L4 84 Z" fill="#111"/>
      <path d="M70 84 L60 120 M310 84 L320 120" stroke="#111" stroke-width="10"/>
      <path d="M30 128 L120 132 L118 146 L28 142 Z M260 132 L350 128 L352 142 L262 146 Z" fill="#ff3a2a"/>
      <path d="M40 150 L340 150 L330 176 L50 176 Z" fill="#2a1414"/>
      <rect x="0" y="160" width="40" height="34" rx="8" fill="#141010"/><rect x="340" y="160" width="40" height="34" rx="8" fill="#141010"/>
      <path d="M60 110 Q190 92 320 110" stroke="#ffb08a" stroke-width="6" fill="none" opacity=".8"/>
    </g>

    <!-- yellow track car, foreground left, cropped by the frame -->
    <g transform="translate(-60 800)">
      <ellipse cx="420" cy="270" rx="460" ry="40" fill="#1a1210" opacity=".6"/>
      <path d="M0 250 Q-10 170 60 140 L260 70 Q420 30 600 80 L740 140 Q800 170 790 240 L780 280 L10 280 Z" fill="url(#yellow)"/>
      <path d="M250 92 Q420 50 590 96 L540 140 Q420 116 300 140 Z" fill="#20222a"/>
      <path d="M330 100 Q420 84 520 102" stroke="#9ab4c8" stroke-width="6" fill="none" opacity=".7"/>
      <path d="M60 200 L250 210 L246 232 L56 222 Z M560 210 L760 200 L762 222 L564 232 Z" fill="#c22a14"/>
      <path d="M90 240 L720 240 L700 276 L110 276 Z" fill="#2c2410"/>
      <path d="M120 150 Q420 110 700 150" stroke="#fff6c8" stroke-width="10" fill="none" opacity=".85"/>
      <rect x="-20" y="230" width="90" height="60" rx="14" fill="#141010"/><rect x="740" y="230" width="90" height="60" rx="14" fill="#141010"/>
    </g>
  </g>
</svg>
